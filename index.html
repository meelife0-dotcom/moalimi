<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الإلكتروني برواية ورش عن نافع | Warsh Recitation & Verifier</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                            950: '#022c22',
                        },
                        amber: {
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        },
                        slate: {
                            850: '#172033',
                            950: '#0b1329'
                        }
                    },
                    fontFamily: {
                        quran: ['Scheherazade New', 'Amiri', 'serif'],
                        amiri: ['Amiri', 'serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts for High-Legibility Arabic Quranic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .font-quran-text {
            font-family: 'Scheherazade New', 'Amiri', serif;
            line-height: 2.3;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #059669;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #10b981;
        }
        
        /* Word Verification Highlights */
        .word-match {
            color: #34d399 !important;
            font-weight: 700;
            background-color: rgba(6, 78, 59, 0.4);
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .word-pending {
            color: #f1f5f9;
            transition: all 0.3s ease;
        }
        .word-missing {
            color: #f87171 !important;
            text-decoration: line-through;
            opacity: 0.8;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }
        .animate-recording {
            animation: pulse-ring 1.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-emerald-600 selection:text-white transition-colors duration-300">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800/80 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <!-- App Logo & Brand -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-600 to-amber-500 flex items-center justify-center text-white font-bold text-2xl shadow-emerald-950 shadow-lg border border-emerald-400/30">
                    <span>ورش</span>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 via-amber-300 to-emerald-200">
                        مصحف ورش مع المصحح الذكي
                    </h1>
                    <p class="text-xs text-slate-400">التلاوة برواية ورش عن نافع مع التدقيق والتصحيح الصوتي الفوري</p>
                </div>
            </div>

            <!-- Navigation Mode Switcher Buttons -->
            <div class="flex items-center space-x-2 space-x-reverse">
                <nav class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs md:text-sm">
                    <button id="btn-tab-mushaf" onclick="switchTab('mushaf')" class="px-3 md:px-5 py-2 rounded-lg bg-emerald-600 text-white font-medium shadow-md transition-all flex items-center">
                        <i class="fa-solid fa-book-quran ml-2 text-amber-300"></i>
                        <span>المصحف</span>
                    </button>
                    <button id="btn-tab-verifier" onclick="switchTab('verifier')" class="px-3 md:px-5 py-2 rounded-lg text-slate-300 hover:text-white transition-all flex items-center">
                        <i class="fa-solid fa-microphone-lines ml-2 text-emerald-400"></i>
                        <span>المصحح التفاعلي</span>
                    </button>
                    <button id="btn-tab-rules" onclick="switchTab('rules')" class="px-3 md:px-5 py-2 rounded-lg text-slate-300 hover:text-white transition-all flex items-center">
                        <i class="fa-solid fa-graduation-cap ml-2 text-amber-400"></i>
                        <span>أحكام ورش</span>
                    </button>
                </nav>

                <!-- Font Size Controls -->
                <div class="hidden lg:flex items-center bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800 space-x-2 space-x-reverse text-xs">
                    <button onclick="changeFontSize(-2)" class="text-slate-400 hover:text-emerald-400 px-1 font-bold text-base" title="تصغير الخط">A-</button>
                    <span id="font-size-label" class="text-emerald-400 font-mono font-semibold">28px</span>
                    <button onclick="changeFontSize(2)" class="text-slate-400 hover:text-emerald-400 px-1 font-bold text-base" title="تكبير الخط">A+</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Sidebar: Surah Directory & Reciter Selection -->
        <aside class="lg:col-span-3 bg-slate-900/90 rounded-2xl p-4 border border-slate-800/80 flex flex-col h-[550px] lg:h-[calc(100vh-140px)] sticky top-20 shadow-2xl">
            <!-- Search Bar -->
            <div class="relative mb-3">
                <input type="text" id="surah-search" oninput="filterSurahs()" placeholder="ابحث عن اسم أو رقم السورة..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 pr-10 text-sm focus:outline-none focus:border-emerald-500 text-slate-200 placeholder-slate-500">
                <i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-500 text-xs"></i>
            </div>

            <!-- Active Reciter Card -->
            <div onclick="toggleReciterModal()" class="cursor-pointer bg-gradient-to-r from-emerald-950/70 to-slate-900 border border-emerald-800/50 hover:border-emerald-500 rounded-xl p-3 mb-3 flex items-center justify-between text-xs transition shadow-md">
                <div class="flex items-center space-x-2.5 space-x-reverse">
                    <div class="w-8 h-8 rounded-full bg-emerald-900/80 border border-emerald-600/50 flex items-center justify-center text-amber-400">
                        <i class="fa-solid fa-user-audio text-sm"></i>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-400">القارئ المعلم (ورش):</div>
                        <div id="current-reciter-name" class="font-bold text-emerald-300">محمود خليل الحصري</div>
                    </div>
